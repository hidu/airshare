{{ range $index,$file:=.UploadFiles }}
<div class="row p-1 border rounded m-1">
    <div class="col-8 small">
         <a href="u-file?name={{ $file.Name }}" target="_blank" class="text-decoration-none">{{ $file.Name }}</a>
    </div>
    <div class="col-4 text-end text-nowrap">
        <a class="btn btn-sm btn-danger me-2 uploadDelete" href="u-delete?name={{ $file.Name }}">删除</a>
        <a class="btn btn-sm btn-primary" href="u-file?name={{ $file.Name }}&action=download">下载</a>
    </div>
</div>
{{ end }}

<script>
(() => {
    const form = document.getElementById('uploadToast');

    function showToast(message, type = 'success') {
        const el = document.getElementById('uploadToast');

        clearTimeout(showToast.Timer);

        el.textContent = message;
        el.className = 'ms-3 ' + (type === 'success' ? 'text-success' : 'text-danger');

        showToast.Timer = setTimeout(() => {
            el.textContent = '';
        }, 3000);
    }

    document.querySelectorAll('.uploadDelete').forEach(el => {
    el.addEventListener('click', async (e) => {
        e.preventDefault();
        if (!confirm('确定要删除这个文件吗？')) {
        return;
        }

        try {
        const resp = await fetch(el.href, {
            method: 'DELETE',
        });

        const response = await resp.json();

        if (resp.ok && response.Code === 0) {
            showToast("已删除");
            el.closest('.row')?.remove();
        } else {
            showToast('删除失败：' + (response.Msg || response.msg || '未知错误'),"error");
        }
        } catch (err) {
          showToast('删除请求失败：' + err.message,"error");
        }
    });
    });
})();
</script>
