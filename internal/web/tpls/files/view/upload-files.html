{{ range $index,$file:=.UploadFiles }}
<div class="row p-1 border rounded m-1">
    <div class="col-8 small">
         <a href="u-file?name={{ $file.Name }}" target="_blank" class="text-decoration-none">{{ $file.Name }}</a>
    </div>
    <div class="col-4 text-end text-nowrap">
        <a class="btn btn-sm btn-danger me-2 uploadDelete" href="u-delete?name={{ $file.Name }}">{{ xi_zh "删除" "Delete" }}</a>
        <a class="btn btn-sm btn-primary" href="u-file?name={{ $file.Name }}&action=download">{{ xi_zh "下载" "Download" }}</a>
    </div>
</div>
{{ end }}

<script>
(() => {
    const form = document.getElementById('uploadToast');

    function showToast(message, type = 'success') {
        const el = document.getElementById('uploadToast');

        clearTimeout(showToast.Timer);

        el.textContent = message;
        el.className = 'ms-3 ' + (type === 'success' ? 'text-success' : 'text-danger');

        showToast.Timer = setTimeout(() => {
            el.textContent = '';
        }, 3000);
    }

    document.querySelectorAll('.uploadDelete').forEach(el => {
    el.addEventListener('click', async (e) => {
        e.preventDefault();
        if (!confirm('{{ xi_zh "确定要删除这个文件吗？" "Delete this file?" }}')) {
        return;
        }

        try {
        const resp = await fetch(el.href, {
            method: 'DELETE',
        });

        const response = await resp.json();

        if (resp.ok && response.Code === 0) {
            showToast('{{ xi_zh "已删除" "Deleted" }}');
            el.closest('.row')?.remove();
        } else {
            showToast('{{ xi_zh "删除失败：" "delete failed:" }}' + (response.Msg || response.msg || '{{ xi_zh "未知错误" "unknown error" }}'),"error");
        }
        } catch (err) {
          showToast('{{ xi_zh "删除请求失败：" "Delete request failed:" }}' + err.message,"error");
        }
    });
    });
})();
</script>
